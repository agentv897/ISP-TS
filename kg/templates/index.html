<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPKG | Spanner Knowledge Graph</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; color: #0f172a; overflow: hidden; }
        .sidebar { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); border-right: 1px solid #e2e8f0; }
        .node:hover { stroke: #2563eb; stroke-width: 2px; cursor: pointer; }
        .link { stroke: #94a3b8; stroke-opacity: 0.6; }
        .glass-panel { background: white; border-radius: 12px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1); }
        #graph-container { width: 100%; height: 100vh; cursor: grab; }
        #graph-container:active { cursor: grabbing; }
    </style>
</head>
<body class="flex h-screen">

    <!-- Sidebar -->
    <aside class="w-96 sidebar h-full flex flex-col p-6 z-10">
        <div class="flex items-center gap-3 mb-8">
            <div class="w-10 h-10 bg-blue-600 rounded-lg flex items-center justify-center text-white font-bold text-xl">S</div>
            <h1 class="text-2xl font-bold tracking-tight">SPKG Platform</h1>
        </div>

        <!-- Search -->
        <div class="mb-8">
            <label class="text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2 block">Search Knowledge Graph</label>
            <div class="relative">
                <input type="text" id="search-input" placeholder="Search drugs, genes, diseases..." 
                       class="w-full bg-slate-100 border-none rounded-xl py-3 pl-10 pr-4 focus:ring-2 focus:ring-blue-500 transition-all outline-none">
                <svg class="w-5 h-5 absolute left-3 top-3.5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                </svg>
            </div>
        </div>

        <!-- Stats / Quick Info -->
        <div class="space-y-4 flex-1 overflow-y-auto no-scrollbar">
            <div class="glass-panel p-4">
                <h3 class="text-sm font-semibold mb-2 text-slate-700">Selected Node</h3>
                <div id="node-details" class="text-sm text-slate-500 italic">
                    Click a node to view properties...
                </div>
            </div>

            <div class="glass-panel p-4">
                <h3 class="text-sm font-semibold mb-2 text-slate-700">Quick Filters</h3>
                <div class="flex flex-wrap gap-2">
                    <button class="px-3 py-1 bg-blue-100 text-blue-700 rounded-full text-xs font-medium hover:bg-blue-200">Drugs</button>
                    <button class="px-3 py-1 bg-green-100 text-green-700 rounded-full text-xs font-medium hover:bg-green-200">Studies</button>
                    <button class="px-3 py-1 bg-purple-100 text-purple-700 rounded-full text-xs font-medium hover:bg-purple-200">Observations</button>
                </div>
            </div>
        </div>

        <!-- System Status -->
        <div class="mt-auto pt-6 border-t border-slate-100">
            <div class="flex items-center justify-between text-xs text-slate-400">
                <span>Spanner GQL Connected</span>
                <span class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></span>
            </div>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 relative bg-slate-50">
        <svg id="graph-container"></svg>
        
        <!-- Legend Overlay -->
        <div class="absolute bottom-6 right-6 glass-panel p-4 flex gap-6">
            <div class="flex items-center gap-2">
                <div class="w-3 h-3 rounded-full bg-blue-600"></div>
                <span class="text-xs font-medium">Drugs</span>
            </div>
            <div class="flex items-center gap-2">
                <div class="w-3 h-3 rounded-full bg-emerald-500"></div>
                <span class="text-xs font-medium">Studies</span>
            </div>
            <div class="flex items-center gap-2">
                <div class="w-3 h-3 rounded-full bg-amber-500"></div>
                <span class="text-xs font-medium">Observations</span>
            </div>
        </div>
    </main>

    <script src="/static/js/graph.js"></script>
</body>
</html>
