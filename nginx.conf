worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # Backend upstream definitions
    upstream data_extraction {
        server 127.0.0.1:8101;
    }

    upstream toxicity_prediction {
        server 127.0.0.1:8102;
    }

    upstream knowledge_graph {
        server 127.0.0.1:8103;
    }

    server {
        listen 7860; # Hugging Face Spaces default port
        server_name localhost;

        # Main frontend serving
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        # Data Extraction Proxy
        location /api/extraction/ {
            proxy_pass http://data_extraction/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_buffering off;
            proxy_cache off;
            proxy_set_header Accept "text/event-stream";
            
            # Increase timeouts for long-running extraction
            proxy_read_timeout 600s;
            proxy_connect_timeout 600s;
            proxy_send_timeout 600s;
        }

        # Toxicity Prediction Proxy
        location /api/tox/ {
            proxy_pass http://toxicity_prediction/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Knowledge Graph Proxy
        location /api/kg/ {
            proxy_pass http://knowledge_graph/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
